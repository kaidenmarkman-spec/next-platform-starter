services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx next dev -H 0.0.0.0 -p 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw new Error('status '+r.status)}).catch(e=>{throw e})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
